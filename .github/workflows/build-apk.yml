name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync web files into the Android project
        run: npx cap sync android

      # مفتاح توقيع ثابت: يسمح بتثبيت كل نسخة جديدة فوق السابقة دون حذف البيانات
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadawli-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
