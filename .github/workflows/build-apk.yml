name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync web files into the Android project
        run: npx cap sync android

      # مفتاح توقيع ثابت: يسمح بتثبيت كل نسخة جديدة فوق السابقة دون حذف البيانات
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      # 1) النسخة الآمنة: ميزات الويب فقط (بلا كود المنبهات الأصلي). تُبنى دائماً.
      - name: Build SAFE APK (web features only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/jadawli-safe.apk

      # 2) النسخة الكاملة: تضيف محرك المنبهات الأصلي. إن فشلت تبقى الآمنة متاحة مع سجل الخطأ.
      - name: Add native alarm engine
        id: native
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out
          python3 tools/patch_android.py 2>&1 | tee out/patch.log

      - name: Build FULL APK (with alarms)
        id: full
        if: steps.native.outcome == 'success'
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../out/full-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../out/jadawli-full.apk

      - name: Report
        if: always()
        run: |
          if [ -f out/jadawli-full.apk ]; then
            echo "### ✅ تم بناء النسخة الكاملة (jadawli-full.apk) والنسخة الآمنة (jadawli-safe.apk)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ فشل بناء النسخة الكاملة. النسخة الآمنة (jadawli-safe.apk) جاهزة. أرسل لي محتوى full-build.log أو patch.log" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::فشل بناء النسخة الكاملة — النسخة الآمنة متاحة، وراجع ملفات السجل في الـ Artifact"
          fi

      - name: Upload APKs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadawli-apk
          path: out/*
          if-no-files-found: error
